set -g prefix C-z

set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows 1

set -g status-position top

set-option -g default-shell /bin/zsh

set -g extended-keys on
set -g extended-keys-format csi-u

# be more like vim
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi v send-keys -X copy-selection-and-cancel

# open pagens in cwd
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'thewtex/tmux-mem-cpu-load'

# config
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g status-right "#[bg=#{@thm_red},fg=#{@thm_mantle}]#[reverse]#[noreverse]#{@catppuccin_cpu_icon}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] "
set -ag status-right "#($TMUX_PLUGIN_MANAGER_PATH/tmux-mem-cpu-load/tmux-mem-cpu-load -m 0) "
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#[bg=#{@thm_yellow},fg=#{@thm_mantle}]#[reverse]#[noreverse]#{@catppuccin_cpu_icon}#[fg=#{@thm_fg},bg=#{@thm_surface_0}] "
set -ag status-right "#(hostname)"
set -g @continuum-restore 'on'

# run tmux plugin manager
run '~/.config/tmux/plugins/tpm/tpm'
